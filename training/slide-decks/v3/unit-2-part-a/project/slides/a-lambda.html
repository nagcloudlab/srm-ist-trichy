<p style="font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#2F5FD0">Part A · §29 · What is λ?</p>
<h2 style="font-size:72px;font-weight:700;line-height:1.1;letter-spacing:-1px;color:#1B2130">λ sets how hard we enforce it</h2>
<div style="display:flex;gap:24px;flex:1;align-items:center"><div style="flex:1;display:flex;flex-direction:column;gap:12px"><p style="font-size:32px;line-height:1.45;color:#4A5263;">A common value</p><p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:120px;font-weight:600;color:#2F5FD0">λ = 10</p></div><div style="flex:1;background:#FFFDF8;border:1px solid #E2DED4;border-radius:20px;padding:48px;display:flex;flex-direction:column;gap:20px"><p style="font-size:28px;line-height:1.45;color:#6B7180;">Gradient norm = 1.3</p><p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:44px;color:#1B2130">(1.3 − 1)² = 0.09</p><p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:56px;font-weight:600;color:#1B2130">GP = 10 × 0.09 = 0.9</p></div></div>
<aside>λ controls the penalty’s strength. With λ = 10 and gradient norm 1.3, the penalty is 0.9: the number used in the full example two slides on.</aside>
