<section id="qc-gp" data-transition="fade" style="background:#F7F5F0;color:#1B2130;font-family:'DM Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:40px">
<p style="font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#2F5FD0">Part A · Quick check · Gradient penalty</p>
<h2 style="font-size:72px;font-weight:700;line-height:1.1;letter-spacing:-1px;color:#1B2130">Quick check: compute the penalty (λ = 10)</h2>
<div style="flex:1;display:flex;gap:24px;align-items:stretch"><div style="flex:1;background:#FFFDF8;border:1px solid #E2DED4;border-radius:16px;padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:28px"><p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;color:#6B7180">a</p><p style="font-size:40px;line-height:1.3;color:#1B2130">‖∇C(x̂)‖ = 1.0</p><div data-build-in="fade 1" style="background:#DCE5FA;border-radius:12px;padding:24px 28px"><p style="font-size:36px;line-height:1.3;color:#1E3F99">10 × 0² = <b>0</b></p></div></div><div style="flex:1;background:#FFFDF8;border:1px solid #E2DED4;border-radius:16px;padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:28px"><p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;color:#6B7180">b</p><p style="font-size:40px;line-height:1.3;color:#1B2130">‖∇C(x̂)‖ = 2.0</p><div data-build-in="fade 2" style="background:#DCE5FA;border-radius:12px;padding:24px 28px"><p style="font-size:36px;line-height:1.3;color:#1E3F99">10 × 1² = <b>10</b></p></div></div><div style="flex:1;background:#FFFDF8;border:1px solid #E2DED4;border-radius:16px;padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:28px"><p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:28px;color:#6B7180">c</p><p style="font-size:40px;line-height:1.3;color:#1B2130">‖∇C(x̂)‖ = 0.5</p><div data-build-in="fade 3" style="background:#DCE5FA;border-radius:12px;padding:24px 28px"><p style="font-size:36px;line-height:1.3;color:#1E3F99">10 × 0.25 = <b>2.5</b></p></div></div></div>
<aside>Point out that (c) is penalised too: the penalty is two-sided, so a too-flat critic also pays.</aside>
