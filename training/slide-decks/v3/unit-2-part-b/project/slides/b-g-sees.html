<p style="font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#2F5FD0">Part B · §7 · The generator must see the condition</p>
<h2 style="font-size:72px;font-weight:700;line-height:1.1;letter-spacing:-1px;color:#1B2130">If G doesn’t see y, it can’t know what we asked for</h2>
<div style="flex:1;display:flex;flex-direction:column;gap:28px;justify-content:center"><div style="display:flex;gap:20px;align-items:center;justify-content:start"><p style="font-size:30px;font-weight:700;color:#6B7180;width:260px">Normal GAN</p><p style="font-size:32px;font-weight:600;color:#1B2130;background:#EEEBE3;padding:18px 26px;border-radius:14px">z</p><p style="font-size:40px;color:#6B7180">→</p><p style="font-size:32px;font-weight:600;color:#1B2130;background:#F2A65A;padding:18px 26px;border-radius:14px">G</p><p style="font-size:40px;color:#6B7180">→</p><p style="font-size:32px;font-weight:600;color:#1B2130;background:#EEEBE3;padding:18px 26px;border-radius:14px">image</p></div><div style="display:flex;gap:20px;align-items:center;justify-content:start"><p style="font-size:30px;font-weight:700;color:#2F5FD0;width:260px">Conditional</p><p style="font-size:32px;font-weight:600;color:#1B2130;background:#DCE5FA;padding:18px 26px;border-radius:14px">z + y</p><p style="font-size:40px;color:#6B7180">→</p><p style="font-size:32px;font-weight:600;color:#1B2130;background:#F2A65A;padding:18px 26px;border-radius:14px">G</p><p style="font-size:40px;color:#6B7180">→</p><p style="font-size:32px;font-weight:600;color:#1B2130;background:#DCE5FA;padding:18px 26px;border-radius:14px">image matching y</p></div></div>
