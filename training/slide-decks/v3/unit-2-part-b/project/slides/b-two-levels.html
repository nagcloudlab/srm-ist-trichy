<p style="font-size:24px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#2F5FD0">Part B · §36 · Conditional control vs latent control</p>
<h2 style="font-size:72px;font-weight:700;line-height:1.1;letter-spacing:-1px;color:#1B2130">Two levels of control</h2>
<div style="display:flex;gap:24px;flex:1;align-items:center"><div style="flex:1;background:#DCE5FA;border-radius:20px;padding:32px 36px;display:flex;flex-direction:column;gap:12px"><h3 style="font-size:40px;font-weight:700;line-height:1.2;color:#1B2130">Explicit condition</h3><p style="font-size:32px;line-height:1.4;color:#4A5263"><b>label = dog</b><br>Tells the model what category.</p></div><div style="flex:1;background:#FBE3CF;border-radius:20px;padding:32px 36px;display:flex;flex-direction:column;gap:12px"><h3 style="font-size:40px;font-weight:700;line-height:1.2;color:#1B2130">Latent control</h3><p style="font-size:32px;line-height:1.4;color:#4A5263"><b>pose · colour · style directions</b><br>Tells the model how the result varies.</p></div></div>
<aside>Explicit conditions and latent controls work at different levels.</aside>
